[build]
  command = "npm run generate"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"

# Redirects do not go here. Nitro writes `_redirects` with a catch-all `/* /404.html 404`, Netlify applies
# `_redirects` before this file, and a rule in this file would never match. They live in nuxt.config.ts (routeRules).
